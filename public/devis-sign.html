<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eloflex — signature</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body{font-family:Calibri,Arial,Helvetica,sans-serif;background:#eef2f6;color:#222;margin:0;padding:20px}
  .wrap{max-width:820px;margin:0 auto}
  .card{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
  h1{color:#1F5C8C;font-size:20px;margin:0 0 4px}
  .sub{color:#666;font-style:italic;font-size:13px;margin:0 0 12px;border-bottom:2px solid #1F5C8C;padding-bottom:8px}
  label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
  input[type=text]{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #ccd3da;border-radius:7px;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid #ccc;padding:7px 9px;text-align:left}
  th{background:#F2F5F8;color:#1F5C8C}
  .r{text-align:right}
  .chk{display:flex;align-items:flex-start;gap:8px;font-weight:400;font-size:13px;margin:12px 0}
  canvas{border:1px dashed #9fb3c6;border-radius:8px;background:#fbfdff;touch-action:none;width:100%;max-width:420px;height:150px;display:block}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{border:none;border-radius:7px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
  .primary{background:#1F5C8C;color:#fff}.ghost{background:#eef2f6;color:#334}
  .primary:disabled{opacity:.5;cursor:not-allowed;background:#9db4c7}
  .msg{padding:12px 14px;border-radius:8px;font-size:14px;margin-top:12px}
  .ok{background:#e7f6ec;color:#1a7a3a}.err{background:#fdecec;color:#b42318}
  .muted{color:#888;font-size:12px}
  .req{color:#b42318;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="doc"><p class="muted">Chargement du document…</p></div>

  <div class="card" id="signcard" style="display:none">
    <h1 id="signtitle">Signature</h1>
    <div class="sub" id="signsub">Merci de relire le document ci-dessus, puis de le signer.</div>
    <label for="signame">Nom du signataire <span class="req">*</span> <span class="muted">(obligatoire)</span></label>
    <input type="text" id="signame" placeholder="Prénom et nom" oninput="refresh()">
    <label>Signature <span class="req">*</span> <span class="muted">(tracez ci-dessous)</span></label>
    <canvas id="pad" width="420" height="150"></canvas>
    <div class="btns" style="margin-top:8px"><button class="ghost" type="button" onclick="clearPad()">Effacer la signature</button></div>
    <div class="chk"><input type="checkbox" id="accept"><label for="accept" style="margin:0;font-weight:400" id="acceptlbl">J'ai lu et j'approuve le contenu — « Lu et approuvé, bon pour accord ». <span class="req">*</span></label></div>
    <div class="btns"><button class="primary" id="btnSign" onclick="signer()" disabled>Signer</button></div>
    <div id="signhint" style="margin-top:8px"></div>
    <div id="msg"></div>
  </div>

  <div class="card" id="done" style="display:none">
    <div class="msg ok" id="donemsg">✔ Merci, votre signature a bien été enregistrée. Une copie signée a été envoyée par e-mail. Vous pouvez fermer cette page.</div>
    <div class="btns"><button class="ghost" type="button" onclick="telechargerPDF()">Télécharger le PDF signé</button></div>
  </div>
</div>

<script>
var TOKEN = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
var DOC = null, MOTS = null;
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fd(d){ if(!d) return '—'; var v=(''+d).slice(0,10).split('-'); return v.length===3? v[2]+'/'+v[1]+'/'+v[0] : d; }
function eur(n,dev){ if(n==null||n==='') return ''; return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(dev||'EUR'); }
function mots(t){ return t==='bdc'
  ? {doc:'bon de commande',Doc:'Bon de commande',accord:'accusé de réception signé',Accord:'Accusé de réception'}
  : {doc:'devis',Doc:'Devis',accord:'bon pour accord',Accord:'Bon pour accord'}; }
function lignesOf(p){ var a=p.lignes; if(typeof a==='string'){ try{a=JSON.parse(a);}catch(e){a=[];} } return Array.isArray(a)?a:[]; }

function docHTML(p){
  var m=MOTS, L=lignesOf(p);
  var rows = L.length ? L.map(function(l){
    return '<tr><td>'+esc(l.nom||l.name||'')+'</td><td class="r">'+(l.qte!=null?esc(l.qte):(l.quantity!=null?esc(l.quantity):''))+'</td>'+
      '<td class="r">'+(l.total!=null?esc(eur(l.total,p.devise)):'')+'</td></tr>';
  }).join('') : '<tr><td colspan="3" class="muted">Détail des lignes non disponible — voir le montant total.</td></tr>';
  return '<h1>'+m.Doc.toUpperCase()+' '+esc(p.numero||'')+'</h1>'+
    '<div class="sub">ELOFLEX SAS — '+esc(m.Doc)+' à valider en ligne</div>'+
    '<table style="margin:0 0 10px"><tr>'+
      '<td style="width:50%;vertical-align:top"><b style="color:#1F5C8C">ÉMETTEUR</b><br><b>ELOFLEX SAS</b><br>info@eloflex.fr</td>'+
      '<td style="vertical-align:top"><b style="color:#1F5C8C">CLIENT</b><br><b>'+esc(p.distributeur_nom||'—')+'</b><br>'+esc(p.client_email||'')+'</td>'+
    '</tr></table>'+
    '<table style="margin:0 0 10px"><tr><td style="width:50%"><b>Date</b> : '+fd(p.date_devis)+'</td>'+
      '<td>'+(p.date_expiration?('<b>Validité</b> : '+fd(p.date_expiration)):'')+'</td></tr></table>'+
    '<table style="margin:0 0 10px"><thead><tr><th>Désignation</th><th class="r" style="width:70px">Qté</th><th class="r" style="width:130px">Total</th></tr></thead>'+
      '<tbody>'+rows+
      '<tr><td class="r" colspan="2" style="font-weight:bold">Montant total</td><td class="r" style="font-weight:bold">'+esc(eur(p.montant,p.devise))+'</td></tr></tbody></table>'+
    '<p style="font-size:12px;color:#555;font-style:italic;margin:6px 0 0">En signant ce '+esc(m.doc)+', le client déclare l\'avoir lu et l\'approuver sans réserve (« Lu et approuvé, '+esc(m.accord)+' »). '+
    'La signature électronique vaut engagement dans les conditions prévues par les articles 1366 et suivants du Code civil.</p>';
}

fetch('/api/devis-public/'+encodeURIComponent(TOKEN)).then(function(r){
  if(!r.ok) return r.json().then(function(j){ throw new Error(j.error||'Lien invalide'); });
  return r.json();
}).then(function(p){
  DOC=p; MOTS=mots(p.doc_type);
  document.title='Eloflex — '+MOTS.Doc+' '+(p.numero||'');
  if(p.pdf){
    // Document original (Pennylane / VosFactures) affiché à l'identique
    var pdfUrl='/api/devis-public/'+encodeURIComponent(TOKEN)+'/pdf';
    document.getElementById('doc').innerHTML =
      '<embed src="'+pdfUrl+'" type="application/pdf" style="width:100%;height:78vh;border:1px solid #e3e8ee;border-radius:8px">'+
      '<div style="margin-top:8px;font-size:12px;color:#888">'+esc(MOTS.Doc)+' '+esc(p.numero||'')+' — '+
        '<a href="'+pdfUrl+'" target="_blank" style="color:#1F5C8C">ouvrir le PDF dans un onglet</a></div>';
  } else {
    document.getElementById('doc').innerHTML = docHTML(p);
  }
  document.getElementById('signtitle').textContent = 'Signature du '+MOTS.doc;
  document.getElementById('btnSign').textContent = 'Signer le '+MOTS.doc;
  document.getElementById('acceptlbl').innerHTML = 'J\'ai lu et j\'approuve le contenu du '+esc(MOTS.doc)+' — « Lu et approuvé, '+esc(MOTS.accord)+' ». <span class="req">*</span>';
  if(p.signed_at){
    document.getElementById('signcard').style.display='none';
    var dn=document.getElementById('done'); dn.style.display='block';
    dn.querySelector('.msg').textContent='Ce '+MOTS.doc+' a déjà été signé'+(p.signataire_nom?(' par '+p.signataire_nom):'')+'.';
  } else {
    document.getElementById('signcard').style.display='block';
    initPad();
  }
}).catch(function(e){
  document.getElementById('doc').innerHTML = '<div class="msg err">'+esc(e.message)+'</div>';
});

// ── Canvas signature ──
var pad, ctx, drawing=false, hasSig=false;
function initPad(){
  pad=document.getElementById('pad'); ctx=pad.getContext('2d');
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle='#12395c';
  function pos(e){ var r=pad.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*(pad.width/r.width), y:(t.clientY-r.top)*(pad.height/r.height)}; }
  function start(e){ drawing=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing)return; var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); hasSig=true; refresh(); e.preventDefault(); }
  function end(){ drawing=false; }
  pad.addEventListener('mousedown',start); pad.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  pad.addEventListener('touchstart',start,{passive:false}); pad.addEventListener('touchmove',move,{passive:false}); pad.addEventListener('touchend',end);
  refresh();
}
function clearPad(){ if(ctx){ctx.clearRect(0,0,pad.width,pad.height);} hasSig=false; refresh(); }
function refresh(){
  var name=(document.getElementById('signame').value||'').trim();
  var checked=document.getElementById('accept').checked;
  var miss=[];
  if(!name||name.length<2) miss.push('votre nom');
  if(!hasSig) miss.push('votre signature');
  if(!checked) miss.push('cocher la case d\'approbation');
  var btn=document.getElementById('btnSign');
  btn.disabled = miss.length>0;
  var hint=document.getElementById('signhint');
  if(hint) hint.innerHTML = miss.length ? ('<span class="muted">Pour signer, il reste : <b>'+miss.join('</b>, <b>')+'</b>.</span>') : '';
}
document.getElementById('accept').addEventListener('change',refresh);

// ── PDF signé (jsPDF autonome) ──
var SIGNED_PDF=null;
function buildPDF(name, sigDataUrl){
  try{
    var jsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; if(!jsPDF) return null;
    var p=DOC, m=MOTS, doc=new jsPDF({unit:'mm',format:'a4'}); var x=15, y=18;
    doc.setTextColor(31,92,140); doc.setFontSize(16); doc.setFont(undefined,'bold');
    doc.text((m.Doc+' '+(p.numero||'')).trim(), x, y); y+=6;
    doc.setDrawColor(31,92,140); doc.line(x,y,195,y); y+=8;
    doc.setTextColor(34,34,34); doc.setFontSize(10); doc.setFont(undefined,'normal');
    doc.text('Émetteur : ELOFLEX SAS — info@eloflex.fr', x, y); y+=5;
    doc.text('Client : '+(p.distributeur_nom||'—')+(p.client_email?(' — '+p.client_email):''), x, y); y+=5;
    doc.text('Date : '+fd(p.date_devis)+(p.date_expiration?('    Validité : '+fd(p.date_expiration)):''), x, y); y+=8;
    var L=lignesOf(p);
    doc.setFont(undefined,'bold'); doc.text('Désignation', x, y); doc.text('Qté', 150, y, {align:'right'}); doc.text('Total', 195, y, {align:'right'}); y+=2;
    doc.line(x,y,195,y); y+=5; doc.setFont(undefined,'normal');
    (L.length?L:[{nom:'(détail non disponible)'}]).forEach(function(l){
      var nom=(l.nom||l.name||''); if(nom.length>70) nom=nom.slice(0,70)+'…';
      doc.text(String(nom), x, y);
      doc.text(String(l.qte!=null?l.qte:(l.quantity!=null?l.quantity:'')), 150, y, {align:'right'});
      doc.text(String(l.total!=null?eur(l.total,p.devise):''), 195, y, {align:'right'});
      y+=6; if(y>250){ doc.addPage(); y=20; }
    });
    y+=2; doc.line(x,y,195,y); y+=6; doc.setFont(undefined,'bold');
    doc.text('Montant total', 150, y, {align:'right'}); doc.text(String(eur(p.montant,p.devise)), 195, y, {align:'right'}); y+=12;
    doc.setFont(undefined,'italic'); doc.setFontSize(9); doc.setTextColor(90,90,90);
    doc.text(doc.splitTextToSize('Lu et approuvé, '+m.accord+'. Signature électronique — art. 1366 s. du Code civil.', 180), x, y); y+=12;
    doc.setFont(undefined,'bold'); doc.setFontSize(10); doc.setTextColor(34,34,34);
    doc.text('Signé par : '+name, x, y); y+=3;
    doc.text('Le : '+fd(new Date().toISOString()), 195, y-3, {align:'right'});
    if(sigDataUrl){ try{ doc.addImage(sigDataUrl,'PNG', x, y, 60, 22); }catch(e){} }
    return doc;
  }catch(e){ return null; }
}
function signer(){
  var name=document.getElementById('signame').value.trim();
  var sig=pad.toDataURL('image/png');
  var pdfData=null;
  try{ var doc=buildPDF(name,sig); if(doc){ pdfData=doc.output('datauristring'); SIGNED_PDF=pdfData; } }catch(e){}
  var btn=document.getElementById('btnSign'); btn.disabled=true; btn.textContent='Envoi…';
  fetch('/api/devis-public/'+encodeURIComponent(TOKEN)+'/signer',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({signataire_nom:name, signature_data:sig, pdf_data:pdfData})
  }).then(function(r){ if(!r.ok) return r.json().then(function(j){throw new Error(j.error||'Erreur');}); return r.json(); })
    .then(function(){ document.getElementById('signcard').style.display='none'; document.getElementById('done').style.display='block'; })
    .catch(function(e){ btn.disabled=false; btn.textContent='Signer le '+(MOTS?MOTS.doc:'document'); document.getElementById('msg').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'; });
}
function telechargerPDF(){
  // Le PDF signé de référence est celui archivé côté serveur (document original + page signature)
  window.open('/api/devis-public/'+encodeURIComponent(TOKEN)+'/signed.pdf','_blank');
}
</script>
</body>
</html>
