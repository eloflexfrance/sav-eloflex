<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAV Éloflex — Connexion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f4f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e4e9;
      border-radius: 14px;
      padding: 40px 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .logo i { font-size: 26px; color: #2563eb; }
    .logo-text { font-size: 19px; font-weight: 700; color: #111; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 28px; margin-top: 4px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      letter-spacing: .03em;
    }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fafafa;
      color: #111;
      font-size: 14px;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      background: #fff;
    }
    .btn-login {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-login:hover { background: #1d4ed8; }
    .btn-login:disabled { opacity: .6; cursor: wait; }
    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 12.5px;
    }
    .langs { display:flex; justify-content:flex-end; gap:4px; margin:-18px -12px 14px 0; }
    .langs button { border:1px solid #e2e4e9; background:#fff; color:#374151; border-radius:7px; padding:4px 9px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
    .langs button.on { background:#2563eb; border-color:#2563eb; color:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="langs" role="group" aria-label="Langue / Language / Språk">
      <button type="button" data-lg="fr">FR</button><button type="button" data-lg="en">EN</button><button type="button" data-lg="sv">SV</button>
    </div>
    <div class="logo">
      <i class="ti ti-wheelchair"></i>
      <span class="logo-text">SAV Éloflex</span>
    </div>
    <p class="subtitle" data-t="sous"></p>

    <div class="field">
      <label for="email" data-t="lEmail"></label>
      <input type="email" id="email" autocomplete="email" data-ph="phEmail">
    </div>
    <div class="field">
      <label for="password" data-t="lMdp"></label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="btn-login" id="btn-login" onclick="seConnecter()" data-t="btn"></button>
    <div class="error" id="err"></div>
    <p style="margin-top:18px;font-size:12.5px;color:#6b7280;text-align:center"><span data-t="distrib"></span> <a href="/espace" id="lien-espace" style="color:#2563eb;font-weight:600" data-t="lienEspace"></a></p>
  </div>

  <script>
    const TXT = {
      fr: { doc: 'SAV Éloflex — Connexion', sous: 'Connectez-vous pour accéder à l’application', lEmail: 'Adresse e-mail', phEmail: 'prenom.nom@eloflex.fr',
        lMdp: 'Mot de passe', btn: 'Se connecter', btnEnCours: 'Connexion en cours…', eVide: 'Veuillez saisir votre e-mail et votre mot de passe.',
        eIdent: 'E-mail ou mot de passe incorrect.', eReseau: 'Impossible de joindre le serveur. Réessayez.',
        distrib: 'Vous êtes distributeur ?', lienEspace: 'Accéder à l’espace distributeur' },
      en: { doc: 'Eloflex After-Sales — Sign in', sous: 'Sign in to access the application', lEmail: 'E-mail address', phEmail: 'firstname.lastname@eloflex.com',
        lMdp: 'Password', btn: 'Sign in', btnEnCours: 'Signing in…', eVide: 'Please enter your e-mail and password.',
        eIdent: 'Incorrect e-mail or password.', eReseau: 'Unable to reach the server. Please try again.',
        distrib: 'Are you a dealer?', lienEspace: 'Go to the dealer area' },
      sv: { doc: 'Eloflex Service — Logga in', sous: 'Logga in för att komma åt applikationen', lEmail: 'E-postadress', phEmail: 'fornamn.efternamn@eloflex.se',
        lMdp: 'Lösenord', btn: 'Logga in', btnEnCours: 'Loggar in…', eVide: 'Ange din e-postadress och ditt lösenord.',
        eIdent: 'Fel e-postadress eller lösenord.', eReseau: 'Det går inte att nå servern. Försök igen.',
        distrib: 'Är du återförsäljare?', lienEspace: 'Gå till återförsäljarportalen' }
    };
    const LS = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} } };
    // Langue explicitement choisie (bouton cliqué) : envoyée à la connexion. Sinon la langue du compte s'applique.
    let choisie = LS.get('login_lang');
    const nav = (navigator.language || 'fr').slice(0, 2).toLowerCase();
    let LG = [new URLSearchParams(location.search).get('lang'), choisie, LS.get('lang'), nav].find(v => v && TXT[v]) || 'fr';
    let errK = '';
    const $ = id => document.getElementById(id);
    function appliquer(lg) {
      LG = TXT[lg] ? lg : 'fr';
      const T = TXT[LG];
      document.documentElement.lang = LG; document.title = T.doc;
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });
      document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = T[el.dataset.ph]; });
      document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.lg === LG));
      $('lien-espace').href = '/espace?lang=' + LG;
      if (errK) $('err').textContent = T[errK];
    }
    document.querySelectorAll('.langs button').forEach(b => b.onclick = () => { choisie = b.dataset.lg; LS.set('login_lang', choisie); appliquer(choisie); });
    appliquer(LG);
    function erreur(k, msg) { errK = msg ? '' : k; const e = $('err'); e.textContent = msg || TXT[LG][k]; e.style.display = 'block'; }

    $('email').addEventListener('keydown', e => { if (e.key === 'Enter') $('password').focus(); });
    $('password').addEventListener('keydown', e => { if (e.key === 'Enter') seConnecter(); });

    async function seConnecter() {
      const T = TXT[LG];
      const email = $('email').value.trim();
      const mot_de_passe = $('password').value;
      const errEl = $('err'), btn = $('btn-login');
      errEl.style.display = 'none'; errK = '';
      if (!email || !mot_de_passe) { erreur('eVide'); return; }
      btn.disabled = true; btn.textContent = T.btnEnCours;
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, mot_de_passe, langue: choisie || undefined })
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
          if (choisie) LS.set('lang', choisie === 'fr' ? 'fr' : 'en');
          const dm = new URLSearchParams(location.search).get('espace_demande');
          window.location.href = /^\d+$/.test(dm || '') ? '/?espace_demande=' + dm : '/';
        } else {
          if (r.status === 401) erreur('eIdent'); else erreur('', data.error || TXT[LG].eIdent);
          btn.disabled = false; btn.textContent = TXT[LG].btn;
          $('password').value = ''; $('password').focus();
        }
      } catch (e) {
        erreur('eReseau'); btn.disabled = false; btn.textContent = TXT[LG].btn;
      }
    }
  </script>
</body>
</html>
