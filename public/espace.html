<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eloflex — Espace distributeur</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f4f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e4e9;
      border-radius: 14px;
      padding: 40px 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .logo i { font-size: 26px; color: #2563eb; }
    .logo-text { font-size: 19px; font-weight: 700; color: #111; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 28px; margin-top: 4px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      letter-spacing: .03em;
    }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fafafa;
      color: #111;
      font-size: 14px;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      background: #fff;
    }
    .btn-login {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-login:hover { background: #1d4ed8; }
    .btn-login:disabled { opacity: .6; cursor: wait; }
    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 12.5px;
    }
      .ok { display:none; margin-top:12px; padding:12px 14px; background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; border-radius:8px; font-size:13px; line-height:1.5; }
    .points { margin: 18px 0 4px; padding: 0; list-style: none; font-size: 12.5px; color: #4b5563; line-height: 1.7; }
    .points i { color: #2563eb; margin-right: 6px; }
    .bas { margin-top: 18px; font-size: 11.5px; color: #9ca3af; text-align: center; }
    .bas a { color: #6b7280; }
    .langs { display:flex; justify-content:flex-end; gap:4px; margin:-18px -12px 14px 0; }
    .langs button { border:1px solid #e2e4e9; background:#fff; color:#374151; border-radius:7px; padding:4px 9px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
    .langs button.on { background:#2563eb; border-color:#2563eb; color:#fff; }
    .opt { font-weight:400; color:#9ca3af; letter-spacing:0; }
    .sep { margin:18px 0 12px; font-size:12px; color:#6b7280; border-top:1px solid #eef0f3; padding-top:12px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="langs" role="group" aria-label="Langue / Language / Språk">
      <button type="button" data-lg="fr">FR</button><button type="button" data-lg="en">EN</button><button type="button" data-lg="sv">SV</button>
    </div>
    <div class="logo">
      <i class="ti ti-building-store"></i>
      <span class="logo-text" data-t="titre"></span>
    </div>
    <p class="subtitle" data-t="sous"></p>

    <div class="field">
      <label for="email" data-t="lEmail"></label>
      <input type="email" id="email" autocomplete="email" data-ph="phEmail">
    </div>
    <p class="sep" data-t="premiere"></p>
    <div class="field">
      <label for="societe"><span data-t="lSociete"></span> <span class="opt" data-t="facult"></span></label>
      <input type="text" id="societe" autocomplete="organization" maxlength="120">
    </div>
    <div class="field">
      <label for="nom"><span data-t="lNom"></span> <span class="opt" data-t="facult"></span></label>
      <input type="text" id="nom" autocomplete="name" maxlength="120">
    </div>
    <div class="field">
      <label for="tel"><span data-t="lTel"></span> <span class="opt" data-t="facult"></span></label>
      <input type="tel" id="tel" autocomplete="tel" maxlength="40">
    </div>
    <button class="btn-login" id="btn" onclick="demander()" data-t="btn"></button>
    <div class="error" id="err"></div>
    <div class="ok" id="ok"></div>

    <ul class="points">
      <li><i class="ti ti-schema"></i><span data-t="p1"></span></li>
      <li><i class="ti ti-file-invoice"></i><span data-t="p2"></span></li>
    </ul>
    <div class="bas"><span data-t="question"></span> <a href="mailto:sav@eloflex.fr">sav@eloflex.fr</a> · <span data-t="tel"></span><br><a href="/login" data-t="equipe"></a></div>
  </div>

  <script>
    const TXT = {
      fr: {
        doc: 'Eloflex — Espace distributeur', titre: 'Espace distributeur Eloflex',
        sous: 'Saisissez votre adresse e-mail professionnelle : vous recevrez un lien de connexion, sans mot de passe.',
        lEmail: 'Adresse e-mail', phEmail: 'contact@votre-societe.fr',
        premiere: 'Première demande d’accès ? Indiquez votre société : notre équipe validera votre accès et vous enverra votre lien.',
        lSociete: 'Société', lNom: 'Nom et prénom', lTel: 'Téléphone', facult: '(facultatif)',
        btn: 'Recevoir mon lien de connexion', btnEnvoi: 'Envoi en cours…', btnRenvoi: 'Renvoyer le lien',
        okHtml: '<b>Demande bien reçue !</b><br>Si votre adresse est déjà enregistrée chez Eloflex, vous recevez votre lien de connexion dans quelques instants (pensez à vérifier les courriers indésirables ; le lien est valable 48 heures).<br>Sinon, votre demande est transmise à notre équipe, qui validera votre accès et vous enverra votre lien par e-mail.',
        eEmail: 'Veuillez saisir une adresse e-mail valide.', eFerme: 'L’espace distributeur est momentanément fermé.',
        eServeur: 'Envoi impossible pour le moment, réessayez plus tard.', eLien: 'Ce lien de connexion a expiré ou n’est plus valide : demandez-en un nouveau ci-dessous.',
        eAutre: 'Une erreur est survenue, réessayez.',
        p1: 'Éclatés de tous les fauteuils Eloflex avec les références des pièces', p2: 'Demande de devis de pièces détachées en PDF, transmise directement à Eloflex',
        question: 'Une question ?', tel: '09 67 66 51 29', equipe: 'Accès équipe Eloflex'
      },
      en: {
        doc: 'Eloflex — Dealer area', titre: 'Eloflex dealer area',
        sous: 'Enter your business e-mail address: you will receive a sign-in link, no password needed.',
        lEmail: 'E-mail address', phEmail: 'contact@your-company.com',
        premiere: 'First access request? Tell us your company: our team will approve your access and send you your link.',
        lSociete: 'Company', lNom: 'Full name', lTel: 'Phone', facult: '(optional)',
        btn: 'Send me my sign-in link', btnEnvoi: 'Sending…', btnRenvoi: 'Send the link again',
        okHtml: '<b>Request received!</b><br>If your address is already registered with Eloflex, you will receive your sign-in link in a few moments (please check your spam folder; the link is valid for 48 hours).<br>Otherwise, your request is forwarded to our team, who will approve your access and e-mail you your link.',
        eEmail: 'Please enter a valid e-mail address.', eFerme: 'The dealer area is temporarily closed.',
        eServeur: 'Unable to send right now, please try again later.', eLien: 'This sign-in link has expired or is no longer valid: request a new one below.',
        eAutre: 'An error occurred, please try again.',
        p1: 'Exploded views of all Eloflex wheelchairs with spare part numbers', p2: 'Spare parts quote request as a PDF, sent directly to Eloflex',
        question: 'Any questions?', tel: '+33 9 67 66 51 29', equipe: 'Eloflex staff sign-in'
      },
      sv: {
        doc: 'Eloflex — Återförsäljarportal', titre: 'Eloflex återförsäljarportal',
        sous: 'Ange din e-postadress i tjänsten: du får en inloggningslänk, inget lösenord behövs.',
        lEmail: 'E-postadress', phEmail: 'kontakt@ditt-foretag.se',
        premiere: 'Första gången du begär åtkomst? Ange ditt företag: vårt team godkänner din åtkomst och skickar din länk.',
        lSociete: 'Företag', lNom: 'För- och efternamn', lTel: 'Telefon', facult: '(valfritt)',
        btn: 'Skicka min inloggningslänk', btnEnvoi: 'Skickar…', btnRenvoi: 'Skicka länken igen',
        okHtml: '<b>Förfrågan mottagen!</b><br>Om din adress redan är registrerad hos Eloflex får du din inloggningslänk inom kort (kontrollera skräpposten; länken är giltig i 48 timmar).<br>Annars skickas din förfrågan till vårt team, som godkänner din åtkomst och mejlar dig din länk.',
        eEmail: 'Ange en giltig e-postadress.', eFerme: 'Återförsäljarportalen är tillfälligt stängd.',
        eServeur: 'Det går inte att skicka just nu, försök igen senare.', eLien: 'Den här inloggningslänken har gått ut eller är inte längre giltig: begär en ny nedan.',
        eAutre: 'Ett fel uppstod, försök igen.',
        p1: 'Sprängskisser för alla Eloflex-rullstolar med reservdelarnas artikelnummer', p2: 'Offertförfrågan på reservdelar som PDF, skickas direkt till Eloflex',
        question: 'Frågor?', tel: '+33 9 67 66 51 29', equipe: 'Inloggning för Eloflex-personal'
      }
    };
    const LS = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} } };
    const q = new URLSearchParams(location.search);
    const nav = (navigator.language || 'fr').slice(0, 2).toLowerCase();
    let LG = [q.get('lang'), LS.get('espace_lang'), nav].find(v => v && TXT[v]) || 'en';
    let envoye = false;
    const $ = id => document.getElementById(id);
    function appliquer(lg) {
      LG = TXT[lg] ? lg : 'fr'; LS.set('espace_lang', LG);
      const T = TXT[LG];
      document.documentElement.lang = LG; document.title = T.doc;
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });
      document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = T[el.dataset.ph]; });
      document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.lg === LG));
      if (envoye) { $('btn').textContent = T.btnRenvoi; $('ok').innerHTML = T.okHtml; }
      if ($('err').dataset.k) $('err').textContent = T[$('err').dataset.k];
    }
    function erreur(k) { const e = $('err'); e.dataset.k = k; e.textContent = TXT[LG][k]; e.style.display = 'block'; }
    document.querySelectorAll('.langs button').forEach(b => b.onclick = () => appliquer(b.dataset.lg));
    appliquer(LG);
    if (q.get('erreur')) erreur(q.get('erreur') === 'lien' ? 'eLien' : 'eAutre');
    $('email').addEventListener('keydown', e => { if (e.key === 'Enter') demander(); });
    async function demander() {
      const T = TXT[LG];
      const email = $('email').value.trim();
      const err = $('err'), ok = $('ok'), btn = $('btn');
      err.style.display = 'none'; err.dataset.k = ''; ok.style.display = 'none';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { erreur('eEmail'); return; }
      btn.disabled = true; btn.textContent = T.btnEnvoi;
      try {
        const r = await fetch('/api/espace/lien', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, societe: $('societe').value.trim(), nom: $('nom').value.trim(), tel: $('tel').value.trim(), langue: LG }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error === 'email' ? 'eEmail' : d.error === 'ferme' ? 'eFerme' : 'eServeur');
        envoye = true; ok.innerHTML = TXT[LG].okHtml; ok.style.display = 'block';
        btn.textContent = TXT[LG].btnRenvoi;
      } catch (e) { erreur(TXT[LG][e.message] ? e.message : 'eServeur'); btn.textContent = envoye ? TXT[LG].btnRenvoi : TXT[LG].btn; }
      btn.disabled = false;
    }
  </script>
</body>
</html>
